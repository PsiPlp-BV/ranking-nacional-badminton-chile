name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  datos:
    name: Python — pipeline de datos (datos/build_data.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover datos
      # Los JSON publicados deben ser exactamente lo que genera el pipeline.
      - run: python datos/build_data.py && git diff --exit-code data/

  app:
    name: Next — motor de ranking, tipos y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
